<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOTS | Black Canadian History</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --forest: #102a23;
  --gold: #ddb05f;
  --cream: #faf7ef;
  --paper: #fffefa;
  --text: #1c2824;
  --muted: #6e766f;
  --line: #e5e2d9;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: 'DM Sans', Arial, sans-serif;
}

h1, h2, h3, p { margin-top: 0; }

a { color: inherit; text-decoration: none; }

button, input, select, textarea { font: inherit; }

button { cursor: pointer; }

.content {
  max-width: 1190px;
  width: calc(100% - 60px);
  margin: auto;
}

/* HEADER */

header {
  background: var(--paper);
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -2px;
  color: var(--forest);
}

.logo span { color: #bd8740; }

nav {
  display: flex;
  gap: 25px;
}

nav a {
  font-size: 13px;
  font-weight: 700;
  color: #4e5c55;
}

nav a:hover, nav a.active { color: #ac7a33; }

.menu-button {
  display: none;
  border: none;
  background: var(--forest);
  color: white;
  padding: 10px 15px;
}

/* HERO */

.hero {
  background: var(--forest);
  color: white;
  display: grid;
  grid-template-columns: 54% 46%;
  min-height: 540px;
}

.hero-content {
  padding: 90px 8%;
  align-self: center;
}

.eyebrow {
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.hero h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(45px, 5.5vw, 75px);
  line-height: 1.1;
  margin: 25px 0;
}

.hero h1 em { color: var(--gold); }

.hero p {
  color: #d2ded7;
  line-height: 1.8;
  max-width: 520px;
  margin-bottom: 30px;
}

.hero-image {
  position: relative;
  overflow: hidden;
  background: #334c40;
}

.hero-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(.2) grayscale(.3);
}

.hero-caption {
  position: absolute;
  bottom: 35px;
  left: 35px;
  color: white;
  background: #102a23b8;
  padding: 15px 20px;
}

.hero-caption strong {
  font-family: Georgia, serif;
  font-size: 23px;
}

/* SEARCH */

.search-form {
  display: flex;
  background: white;
  padding: 6px;
  border-radius: 5px;
  max-width: 600px;
}

.search-form input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 15px;
  font-size: 13px;
}

.search-form button {
  background: var(--gold);
  color: var(--forest);
  border: none;
  padding: 14px 22px;
  font-size: 12px;
  font-weight: 800;
}

/* GENERAL */

section.block { padding: 75px 0; }

.section-heading {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 36px;
  margin-bottom: 13px;
}

.subtitle {
  color: var(--muted);
  line-height: 1.8;
}

.page-heading {
  background: var(--forest);
  color: white;
  padding: 75px 0;
}

.page-heading h1 {
  font: 600 clamp(38px, 5vw, 60px) 'Playfair Display', Georgia, serif;
  margin: 15px 0;
}

.page-heading p {
  color: #cedcd1;
  line-height: 1.8;
  max-width: 680px;
}

/* CATEGORIES */

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 30px;
}

.category-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 240px;
  padding: 25px;
  color: white;
  background-color: var(--forest);
  background-size: cover;
  background-position: center;
}

.category-card h3 {
  font: 600 29px 'Playfair Display', Georgia, serif;
  margin: 0 0 8px;
}

.category-card p {
  font-size: 12px;
  color: #f0f0e9;
}

.category-card:hover { transform: translateY(-3px); }

.community-image {
  background-image:
    linear-gradient(#122f23ad, #122f23dd),
    url('https://archives-novascotia.shop/cdn/shop/files/200715051.jpg?v=1698925353&width=1946');
}

.people-image {
  background-image:
    linear-gradient(#122f23aa, #122f23dd),
    url('https://www.bankofcanada.ca/wp-content/uploads/2016/04/Viola-Desmond.jpg');
}

.culture-image {
  background-image:
    linear-gradient(#122f23ad, #122f23dd),
    url('https://archives.novascotia.ca/images/africville/200715098.jpg');
}

/* FILTERS */

.filter-panel {
  background: #efeee8;
  border: 1px solid var(--line);
  padding: 25px;
  margin: 30px 0;
}

.filter-panel h3 {
  font-family: Georgia, serif;
  font-size: 23px;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.filter-group label {
  display: block;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--forest);
}

.filter-group select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  background: white;
  border: 1px solid #d6d7ce;
  color: var(--text);
}

.clear-button, .dark-button {
  background: var(--forest);
  color: white;
  border: none;
  padding: 13px 20px;
  font-size: 12px;
  font-weight: 800;
}

.clear-button { margin-top: 20px; }

.results-info {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin: 25px 0;
  font-size: 13px;
  color: var(--muted);
}

/* HISTORICAL RECORDS */

.record-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.record-card {
  background: white;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}

.record-photo {
  height: 210px;
  background: #d4dccc;
  overflow: hidden;
}

.record-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(.35) sepia(.15);
}

.image-fallback {
  width: 100%;
  min-height: 100%;
  background: linear-gradient(135deg, #cbd5c8, #91a996);
  color: #294538;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 600 20px Georgia, serif;
  text-align: center;
  padding: 20px;
}

.record-content {
  padding: 24px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.record-category {
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #94703b;
  font-weight: 800;
}

.record-content h3 {
  font: 600 23px/1.3 'Playfair Display', Georgia, serif;
  margin: 13px 0;
}

.record-description {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.8;
  flex: 1;
}

.record-meta {
  border-top: 1px solid var(--line);
  padding-top: 15px;
  font-size: 12px;
  line-height: 1.8;
  color: #566358;
}

.access-label {
  display: inline-block;
  background: #e5ede3;
  color: #204a36;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 800;
  margin-top: 12px;
}

.record-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 18px;
}

.record-actions a {
  font-size: 12px;
  color: var(--forest);
  font-weight: 800;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.record-actions .details-link {
  background: var(--forest);
  color: white;
  padding: 13px;
  text-decoration: none;
  text-align: center;
}

.source-missing {
  color: var(--muted);
  font-size: 12px;
}

/* RECORD DETAILS */

.details-layout {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 60px;
}

.detail-image {
  width: 100%;
  height: 400px;
  object-fit: cover;
}

.details-main h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 32px;
  margin-top: 35px;
}

.details-main p {
  color: #526057;
  line-height: 2;
}

.details-panel {
  background: #eaece3;
  padding: 30px;
}

.details-panel h3 {
  font-family: Georgia, serif;
  font-size: 24px;
}

.details-panel dt {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: #798379;
  letter-spacing: 1px;
  margin-top: 20px;
}

.details-panel dd {
  margin: 7px 0;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.details-panel .dark-button {
  display: block;
  text-align: center;
  margin-top: 25px;
}

.detail-notice {
  background: #f0eadd;
  padding: 18px;
  font-size: 12px;
  color: #706951;
  line-height: 1.7;
  margin-top: 25px;
}

.source-note {
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
}

/* TIMELINE */

.timeline-item {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 30px;
  border-bottom: 1px solid var(--line);
  padding: 28px 0;
}

.timeline-year {
  color: #98753e;
  font: 600 29px Georgia, serif;
}

.timeline-item h3 {
  font: 600 24px Georgia, serif;
}

.timeline-item p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.8;
}

/* MAP */

.map-layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 20px;
}

.map-list {
  background: white;
  border: 1px solid var(--line);
  padding: 20px;
}

.map-list button {
  display: block;
  width: 100%;
  padding: 15px 5px;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: white;
  color: var(--forest);
}

.map-list button:hover { background: #eff1e9; }

.map-list small {
  display: block;
  color: var(--muted);
  margin-top: 6px;
}

.map-frame {
  width: 100%;
  height: 480px;
  border: 1px solid var(--line);
}

/* CONTRIBUTIONS */

.contribution-form {
  background: white;
  padding: 35px;
  border: 1px solid var(--line);
  max-width: 800px;
  margin: 30px auto;
}

.contribution-form label {
  display: block;
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 20px;
}

.contribution-form input,
.contribution-form select,
.contribution-form textarea {
  display: block;
  width: 100%;
  padding: 13px;
  border: 1px solid #d6d8ce;
  margin-top: 8px;
  background: white;
}

.contribution-form textarea { resize: vertical; }

.notice {
  padding: 18px;
  background: #ebe7da;
  color: #726647;
  font-size: 12px;
  line-height: 1.8;
  margin: 20px 0;
}

.empty-state {
  grid-column: 1 / -1;
  background: white;
  padding: 50px;
  text-align: center;
  color: var(--muted);
}

/* FOOTER */

footer {
  background: var(--forest);
  color: #d7e2d8;
  text-align: center;
  padding: 40px;
  font-size: 13px;
}

footer .logo { color: white; }

/* MOBILE */

@media (max-width: 950px) {
  .hero { grid-template-columns: 1fr; }
  .hero-image { height: 350px; }

  .record-grid,
  .category-grid,
  .filter-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .details-layout { grid-template-columns: 1fr; }

  .map-layout { grid-template-columns: 1fr; }
}

@media (max-width: 650px) {
  header { flex-wrap: wrap; }

  .menu-button { display: block; }

  nav {
    display: none;
    flex-direction: column;
    width: 100%;
    padding-top: 20px;
  }

  nav.open { display: flex; }

  .content { width: calc(100% - 36px); }

  .hero-content { padding: 65px 22px; }

  .hero h1 { font-size: 53px; }

  .record-grid,
  .category-grid,
  .filter-grid {
    grid-template-columns: 1fr;
  }

  .search-form button { padding: 12px; }

  .page-heading { padding: 55px 0; }

  .page-heading h1 { font-size: 36px; }

  .timeline-item {
    grid-template-columns: 75px 1fr;
    gap: 15px;
  }

  .timeline-year { font-size: 20px; }

  .contribution-form { padding: 20px; }
}
</style>
</head>

<script>
// Sample data for the frontend.

const sampleRecords = [

// Use externally provided records when available.
// The original sourceURL and institution fields
// should be preserved when integrating real data.

const incomingRecords = Array.isArray(window.ROOTS_DATA)
  ? window.ROOTS_DATA
  : sampleRecords;

// Remove repeated IDs without removing different stories
// that share the same archival collection URL.

const seen = new Set();

const records = incomingRecords.filter(record => {
  const id = String(record.id || "").trim().toLowerCase();

  if (!id || seen.has(id)) return false;

  seen.add(id);
  return true;
});

const accessTypes = [
  "Digital/Online",
  "In Person",
  "Request Access",
  "Rental/Borrowing",
  "Not Specified"
];

const state = {
  query: "",
  category: "",
  year: "",
  institution: "",
  person: "",
  place: "",
  subject: "",
  type: "",
  access: ""
};

const app = document.getElementById("app");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function safeURL(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol)
      ? url.href
      : "";
  } catch {
    return "";
  }
}

function asArray(value) {
  if (Array.isArray(value)) return value;
  return value ? [value] : [];
}

function getAccess(record) {
  const raw = String(record.accessMethod || record.access || "").trim();
  const legacy = {
    "Online": "Digital/Online",
    "Available by Request": "Request Access",
    "On-site Only": "In Person",
    "Unknown": "Not Specified"
  };
  const value = legacy[raw] || raw;
  return accessTypes.includes(value) ? value : "Not Specified";
}

function getPeople(record) {
  return asArray(record.people || record.persons);
}

function getSubjects(record) {
  return asArray(record.subjects || record.keywords);
}

function imageHTML(record) {
  const url = safeURL(record.image);

  if (!url) {
    return `<div class="image-fallback">Historical Record</div>`;
  }

  return `
    <img src="${esc(url)}"
         alt="${esc(record.imageAlt || record.title)}"
         loading="lazy">
  `;
}

// Replace unavailable images with a simple fallback.

document.addEventListener("error", event => {
  const img = event.target;

  if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.failed) return;

  img.dataset.failed = "true";

  // Only contributed draft images use the illustrated fallback.
  // Historical records retain their existing error handling.
  if (img.closest("#draftResults")) {
    const fallback = document.createElement("div");
    fallback.className = "record-photo";
    fallback.setAttribute("aria-label", "Default illustration for a contributed story whose image could not be loaded");
    fallback.innerHTML = contributionPlaceholderSVG();
    const photo = img.closest(".record-photo");
    if (photo) photo.replaceWith(fallback);
    else img.replaceWith(fallback);
    return;
  }

  const fallback = document.createElement("div");
  fallback.className = "image-fallback";
  fallback.textContent = "Image unavailable";

  img.replaceWith(fallback);

// Filter options

function unique(values) {
  return [...new Set(values.filter(Boolean).map(String))]
    .sort((a, b) => a.localeCompare(b));
}

function getOptions(key) {
  if (key === "year") {
    return unique(records.map(r => r.year == null ? "" : String(r.year)))
      .sort((a, b) => Number(a) - Number(b));
  }

  if (key === "category") {
    return unique(records.map(r => r.category));
  }

  if (key === "person") {
    return unique(records.flatMap(getPeople));
  }

  if (key === "subject") {
    return unique(records.flatMap(getSubjects));
  }

  if (key === "place") {
    return unique(records.map(r => r.location));
  }

  if (key === "access") {
    return accessTypes;
  }

  return unique(records.map(r => r[key]));
}

function filterSelect(label, key) {
  return `
    <div class="filter-group">
      <label for="filter-${key}">${label}</label>

      <select id="filter-${key}"
              data-filter="${key}">
        <option value="">All ${label.toLowerCase()}</option>

        ${getOptions(key).map(value => `
          <option value="${esc(value)}"
            ${state[key] === value ? "selected" : ""}>
            ${esc(value)}
          </option>
        `).join("")}
      </select>
    </div>
  `;
}

function filtersHTML() {
  return `
    <div class="filter-panel">
      <h3>Filter Historical Records</h3>

      <div class="filter-grid">
        ${filterSelect("Communities / Categories", "category")}
        ${filterSelect("Dates (Year)", "year")}
        ${filterSelect("Institutions", "institution")}
        ${filterSelect("People", "person")}
        ${filterSelect("Places", "place")}
        ${filterSelect("Subjects", "subject")}
        ${filterSelect("Resource Types", "type")}
        ${filterSelect("Access", "access")}
      </div>

      <button class="clear-button" id="clearFilters">
        Clear Filters
      </button>
    </div>
  `;
}

function matchesFilters(record) {
  if (state.year && String(record.year ?? "") !== state.year) {
    return false;
  }

  if (state.category &&
      record.category !== state.category) {
    return false;
  }

  const fields = {
    institution: record.institution,
    place: record.location,
    type: record.type,
    access: getAccess(record)
  };

  for (const key of Object.keys(fields)) {
    if (state[key] &&
        String(fields[key] || "").toLowerCase() !==
        state[key].toLowerCase()) {
      return false;
    }
  }

  if (state.person &&
      !getPeople(record).some(person =>
        String(person).toLowerCase() === state.person.toLowerCase()
      )) {
    return false;
  }

  if (state.subject &&
      !getSubjects(record).some(subject =>
        String(subject).toLowerCase() === state.subject.toLowerCase()
      )) {
    return false;
  }

  if (state.query) {
    const text = [
      record.title,
      record.description,
      record.category,
      record.institution,
      record.location,
      record.period,
      record.type,
      getAccess(record),
      ...getPeople(record),
      ...getSubjects(record)
    ].join(" ").toLowerCase();

    if (!text.includes(state.query.toLowerCase().trim())) {
      return false;
    }
  }

  return true;
}

function getFilteredRecords() {
  return records.filter(matchesFilters);
}

    lon + size

}

function draftDuplicate(a, b) {
  const normalize = text =>
    String(text || "").trim().toLowerCase();

  return normalize(a.title) === normalize(b.title) &&
         normalize(a.location) === normalize(b.location) &&
         normalize(a.period) === normalize(b.period);
}

function renderDrafts() {
  const container = document.getElementById("draftResults");
  if (!container) return;

  const drafts = loadDrafts();

  container.innerHTML = drafts.length
    ? drafts.map(item => `

            <img src="${esc(safeURL(item.image))}" alt="${esc(item.title)}" loading="lazy">

            ${contributionPlaceholderSVG()}

        `}
        <div class="record-content">
          <span class="record-category">Unverified Draft</span>
          <h3>${esc(item.title)}</h3>
          <p class="record-description">
            ${esc(item.description)}

                  data-delete="${esc(item.id)}">

function saveContribution(form) {
  const values = Object.fromEntries(new FormData(form));
  const message = document.getElementById("formMessage");

  const draft = {
    id: "draft-" + Date.now(),
    title: String(values.title || "").trim(),
    description: String(values.description || "").trim(),
    category: values.category,
    period: values.period || "",
    location: values.location || "",
    institution: values.institution || "",
    sourceURL: values.sourceURL || "",
    image: values.image || "",
    contributor: values.contributor || "",
    status: "Unverified Draft"
  };

  const drafts = loadDrafts();

  if (drafts.some(old => draftDuplicate(old, draft))) {
    message.textContent =
      "This story is already in your saved drafts.";
    return;
  }

  try {
    saveDrafts([draft, ...drafts]);
    form.reset();
    message.textContent = "Draft saved in this browser.";
    renderDrafts();
  } catch {
    message.textContent = "Could not save this draft.";
  }
}

// Router

function renderPage() {
  const route = location.hash.slice(1) || "/";
  const [path, query] = route.split("?");

  if (path === "/") {
    app.innerHTML = homePage();
  }

  else if (path === "/explore") {
    const requested = new URLSearchParams(query || "")
      .get("category");

    state.category = requested || "";
    state.query = "";

    app.innerHTML = explorePage();
    updateResults();
  }

  else if (path === "/search") {
    state.category = "";

    const params = new URLSearchParams(query || "");
    state.query = params.get("q") || state.query;

    app.innerHTML = searchPage();
    updateResults();
  }

  else if (path === "/timeline") {
    app.innerHTML = timelinePage();
  }

  else if (path === "/map") {
    app.innerHTML = mapPage();
  }

  else if (path === "/contribute") {
    app.innerHTML = contributionPage();
    renderDrafts();
  }

  else if (path.startsWith("/record/")) {
    const id = decodeURIComponent(path.slice(8));
    app.innerHTML = recordPage(id);
  }

  else {
    location.hash = "#/";
    return;
  }

  document.querySelectorAll("nav a").forEach(link => {
    link.classList.toggle(
      "active",
      link.getAttribute("href") === "#" + path
    );
  });

  document.getElementById("navigation")
    .classList.remove("open");

  document.getElementById("menuButton")
    .setAttribute("aria-expanded", "false");

  window.scrollTo(0, 0);
}

function updateResults() {
  const items = getFilteredRecords();

  const results = document.getElementById("results");
  const info = document.getElementById("resultsInfo");

  if (results) results.innerHTML = recordGrid(items);

  if (info) {
    info.textContent =
      `${items.length} record${items.length === 1 ? "" : "s"} found`;
  }
}

// Event handling

document.addEventListener("submit", event => {
  if (event.target.id === "homeSearch") {
    event.preventDefault();

    const query = new FormData(event.target).get("query");

    location.hash =
      "#/search?q=" + encodeURIComponent(query);
  }

  if (event.target.id === "resultsSearch") {
    event.preventDefault();

    state.query =
      document.getElementById("searchInput").value.trim();

    updateResults();
  }

  if (event.target.id === "contributionForm") {
    event.preventDefault();
    saveContribution(event.target);
  }
});

document.addEventListener("change", event => {
  const key = event.target.dataset.filter;

  if (key && Object.prototype.hasOwnProperty.call(state, key)) {
    state[key] = event.target.value;
    updateResults();
  }
});

document.addEventListener("click", event => {
  if (event.target.id === "clearFilters") {
    for (const key of [
      "category", "year", "institution", "person", "place",
      "subject", "type", "access"
    ]) {
      state[key] = "";
    }

    document.querySelectorAll("[data-filter]").forEach(select => {
      select.value = "";
    });

    updateResults();
  }

  const mapButton = event.target.closest("[data-place]");

  if (mapButton) {
    const record = records.find(r =>
      String(r.id) === mapButton.dataset.place
    );

    if (record && Array.isArray(record.coordinates)) {
      document.getElementById("mapFrame").src =
        mapURL(record.coordinates);

      document.getElementById("mapSelected").textContent =
        record.title + " — " + record.location;
    }
  }

  const deleteButton = event.target.closest("[data-delete]");

  if (deleteButton) {
    const drafts = loadDrafts().filter(item =>
      item.id !== deleteButton.dataset.delete
    );

    saveDrafts(drafts);
    renderDrafts();
  }
});

document.getElementById("menuButton").addEventListener("click", () => {
  const menu = document.getElementById("navigation");
  const open = menu.classList.toggle("open");

  document.getElementById("menuButton")
    .setAttribute("aria-expanded", String(open));
});

window.addEventListener("hashchange", renderPage);

renderPage();
</script>
</body>
</html>
