<!-- ROOTS DISCOVERY UPDATES -->
<!-- Keep all existing HTML, CSS and JavaScript unchanged. -->

<style>
  .roots-import {
    max-width: 800px;
    margin: 24px auto 45px;
    background: white;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .roots-import h2 {
    margin: 0 0 12px;
    font-family: Georgia, serif;
  }

  .roots-import p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  .roots-import input {
    max-width: 100%;
    margin: 12px 0;
    display: block;
  }

  .roots-import button {
    background: var(--forest);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 12px 18px;
    font-weight: 700;
  }

  .roots-draft-export {
    display: block;
    align-self: flex-start;
    margin: 12px 0;
    border: 1px solid #cbd6cb;
    border-radius: 6px;
    padding: 9px 13px;
    color: var(--forest);
    background: #edf1eb;
  }

  @media (max-width: 600px) {
    .roots-import {
      padding: 18px;
    }

    .roots-import button {
      width: 100%;
    }
  }
</style>

<script>
/*
  ROOTS FRONTEND UPDATES

  Existing website functionality is preserved.

  Changes:
  1. Updated access options
  2. Preserved original permissions and restrictions
  3. Improved discovery filters
  4. Added JSON metadata import to Contribute
  5. Prevented duplicate imported drafts

  No changes to the Python scripts or database.
*/

(() => {

  // ACCESS METHODS

  const accessMethods = [
    "Digital/Online",
    "In Person",
    "Request Access",
    "Rental/Borrowing",
    "Not Specified"
  ];

  const accessAliases = {
    "online": "Digital/Online",
    "digital": "Digital/Online",
    "digital/online": "Digital/Online",

    "on-site only": "In Person",
    "onsite": "In Person",
    "in person": "In Person",

    "available by request": "Request Access",
    "by request": "Request Access",
    "request access": "Request Access",

    "loan": "Rental/Borrowing",
    "borrowing": "Rental/Borrowing",
    "rental": "Rental/Borrowing",
    "rental/borrowing": "Rental/Borrowing"
  };

  const normal = value =>
    String(value ?? "")
      .trim()
      .replace(/\s+/g, " ")
      .toLowerCase();

  const values = value =>
    Array.isArray(value) ? value : value ? [value] : [];

  const url = value => {
    try {
      const parsed = new URL(value);

      return ["http:", "https:"].includes(parsed.protocol)
        ? parsed.href
        : "";
    } catch {
      return "";
    }
  };

  const people = record =>
    values(
      record.people ||
      record.persons ||
      (record.category === "People" ? record.title : null)
    );

  const subjects = record =>
    values(
      record.subjects ||
      record.subject ||
      record.keywords ||
      record.key_words
    );


  // UPDATE ACCESS DROPDOWN
  // Preserve original access information in each record.

  validAccess.splice(
    0,
    validAccess.length,
    ...accessMethods
  );

  getAccess = record => {
    const supplied =
      record.accessMethod ||
      record.access_method ||
      record.accessMode ||
      record.access;

    const label =
      accessAliases[normal(supplied)] || supplied;

    return accessMethods.includes(label)
      ? label
      : "Not Specified";
  };


  // HOW TO ACCESS A RESOURCE

  accessExplanation = record => {

    if (record.accessInstructions || record.accessNote) {
      return record.accessInstructions || record.accessNote;
    }

    const explanations = {
      "Digital/Online":
        "Use the original source link to check the digital resource and its permissions.",

      "In Person":
        "Contact the holding institution for visiting hours and on-site access conditions.",

      "Request Access":
        "Contact the holding institution to request access and confirm any fees or waiting periods.",

      "Rental/Borrowing":
        "Ask the holding institution about borrowing eligibility, loan terms and fees.",

      "Not Specified":
        "The access method has not been confirmed. Ask the holding institution."
    };

    return explanations[getAccess(record)];
  };


  // ORIGINAL SOURCE LINKS

  originalLink = record => {
    const original = url(
      record.sourceURL ||
      record.originalURL ||
      record.source
    );

    return original
      ? `<a class="source-link"
           href="${escapeHTML(original)}"
           target="_blank"
           rel="noopener noreferrer">
           View original institution source
         </a>`
      : `<span class="source-missing">
           Original source link not supplied
         </span>`;
  };


  // DISCOVERY FILTERS
  // Reuse existing records rather than creating another dataset.

  filterOptions = key => {

    if (key === "access") {
      return accessMethods;
    }

    let options;

    if (key === "person") {
      options = allRecords.flatMap(people);
    }

    else if (key === "subject") {
      options = allRecords.flatMap(subjects);
    }

    else if (key === "place") {
      options = allRecords.map(record => record.location);
    }

    else if (key === "institution") {
      options = allRecords.map(record =>
        record.institution || record.holdingInstitution
      );
    }

    else if (key === "type") {
      options = allRecords.map(record =>
        record.type || record.resourceType
      );
    }

    else {
      options = [];
    }

    return [...new Set(
      options.filter(Boolean).map(String)
    )].sort((a, b) => a.localeCompare(b));
  };


  // FILTER MATCHING

  state.category = "";

  matchesFilters = record => {

    if (
      state.category &&
      record.category !== state.category
    ) {
      return false;
    }

    const columns = {
      institution:
        record.institution || record.holdingInstitution,

      place:
        record.location,

      type:
        record.type || record.resourceType,

      access:
        getAccess(record)
    };

    for (const [key, value] of Object.entries(columns)) {

      if (
        state[key] &&
        normal(state[key]) !== normal(value)
      ) {
        return false;
      }
    }

    if (
      state.person &&
      !people(record).some(person =>
        normal(person) === normal(state.person)
      )
    ) {
      return false;
    }

    if (
      state.subject &&
      !subjects(record).some(subject =>
        normal(subject) === normal(state.subject)
      )
    ) {
      return false;
    }

    return true;
  };


  // PRESERVE ORIGINAL RESTRICTIONS AND PERMISSIONS
  // Add information to the existing record details modal.

  const originalOpenRecord = openRecord;

  openRecord = id => {

    originalOpenRecord(id);

    const record = allRecords.find(
      item => String(item.id) === String(id)
    );

    const definitionList =
      document.querySelector("#modalContent dl");

    if (!record || !definitionList) return;

    const fields = [
      [
        "Original access label",
        record.access || "Not supplied"
      ],
      [
        "Original restrictions",
        record.accessRestrictions ||
        record.restrictions ||
        "Not supplied"
      ],
      [
        "Permissions and reproduction rights",
        record.permissions ||
        record.rights ||
        "Not supplied"
      ]
    ];

    for (const [heading, value] of fields) {

      const dt = document.createElement("dt");
      const dd = document.createElement("dd");

      dt.textContent = heading;
      dd.textContent = String(value);

      definitionList.append(dt, dd);
    }
  };


  // JSON IMPORT
  // Only add the section to the Contribute page.

  const originalContributePage = contributePage;

  contributePage = () => originalContributePage() + `

    <section class="roots-import"
             id="rootsMetadataImport">

      <h2>Import Historical Metadata (JSON)</h2>

      <p>
        Import metadata as private, unverified drafts.
        This does not update the catalogue or run
        the team's scripts.
      </p>

      <label for="rootsMetadataFile">
        JSON metadata file
      </label>

      <input
        type="file"
        id="rootsMetadataFile"
        accept=".json,application/json">

      <button type="button"
              id="rootsImportButton">
        Import as drafts
      </button>

      <p id="rootsImportStatus"
         role="status"
         aria-live="polite"></p>

    </section>
  `;


  // ALLOW DRAFTS TO BE EXPORTED

  const originalRenderDrafts = renderDrafts;

  renderDrafts = () => {

    originalRenderDrafts();

    const container =
      document.getElementById("draftResults");

    if (!container) return;

    container
      .querySelectorAll("[data-delete]")
      .forEach(button => {

        const exportButton =
          document.createElement("button");

        exportButton.type = "button";

        exportButton.className =
          "roots-draft-export";

        exportButton.dataset.exportDraft =
          button.dataset.delete;

        exportButton.textContent =
          "Download JSON";

        button.before(exportButton);
      });
  };


  // DUPLICATE PREVENTION
  // Shared institution URLs do not mean the stories are duplicates.

  const importedDuplicate = (left, right) => {

    const leftId = normal(
      left.originalId ||
      left.recordId ||
      left.identifier
    );

    const rightId = normal(
      right.originalId ||
      right.recordId ||
      right.identifier
    );

    if (
      leftId &&
      rightId &&
      leftId === rightId
    ) {
      return true;
    }

    const firstTitle = normal(
      left.title || left.name
    );

    const secondTitle = normal(
      right.title || right.name
    );

    if (
      !firstTitle ||
      firstTitle !== secondTitle
    ) {
      return false;
    }

    const sameDescription =
      normal(left.description) &&
      normal(left.description) ===
      normal(right.description);

    const sameDetails =
      normal(left.period || left.date) &&
      normal(left.period || left.date) ===
      normal(right.period || right.date) &&
      normal(left.location) &&
      normal(left.location) ===
      normal(right.location);

    return Boolean(
      sameDescription ||
      sameDetails
    );
  };


  // CONVERT IMPORTED METADATA INTO A DRAFT
  // Supports name, date, source, description from add_items.

  const toDraft = record => {

    if (
      !record ||
      typeof record !== "object" ||
      Array.isArray(record)
    ) {
      return null;
    }

    const title = String(
      record.title || record.name || ""
    ).trim();

    const description = String(
      record.description || ""
    ).trim();

    if (
      !title ||
      !description ||
      title.length > 120 ||
      description.length > 3000
    ) {
      return null;
    }

    const rawSource =
      record.sourceURL ||
      record.source ||
      record.originalURL ||
      "";

    const sourceURL = rawSource
      ? url(rawSource)
      : "";

    if (rawSource && !sourceURL) {
      return null;
    }

    return {
      id:
        "draft-" +
        Date.now() +
        "-" +
        Math.random().toString(36).slice(2, 10),

      originalId: String(
        record.id ||
        record.recordId ||
        record.identifier ||
        ""
      ),

      title,
      description,

      category: String(
        record.category || "Other"
      ),

      period: String(
        record.period || record.date || ""
      ),

      location: String(
        record.location || ""
      ),

      type: String(
        record.type || "Historical metadata"
      ),

      institution: String(
        record.institution || ""
      ),

      sourceURL,

      access: String(
        record.access || "Unknown"
      ),

      accessRestrictions: String(
        record.accessRestrictions || ""
      ),

      permissions: String(
        record.permissions || record.rights || ""
      ),

      status: "Unverified Draft"
    };
  };


  // IMPORT JSON FILE

  async function importJSON() {

    const input =
      document.getElementById("rootsMetadataFile");

    const feedback =
      document.getElementById("rootsImportStatus");

    const file = input?.files?.[0];

    if (!file) {
      feedback.textContent =
        "Choose a JSON file first.";
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      feedback.textContent =
        "Maximum file size is 2 MB.";
      return;
    }

    try {

      const json =
        JSON.parse(await file.text());

      const candidates =
        Array.isArray(json) ? json :
        Array.isArray(json.records) ? json.records :
        Array.isArray(json.items) ? json.items :
        Array.isArray(json.data) ? json.data :
        [json];

      if (candidates.length > 3000) {
        throw new Error(
          "Import up to 3,000 records at once."
        );
      }

      const drafts = loadDrafts();

      let imported = 0;
      let skipped = 0;

      for (const raw of candidates) {

        const draft = toDraft(raw);

        const duplicate = draft &&
          [...allRecords, ...drafts].some(other =>
            importedDuplicate(
              {
                ...other,
                originalId:
                  other.originalId || other.id
              },
              draft
            )
          );

        if (!draft || duplicate) {
          skipped++;
          continue;
        }

        drafts.push(draft);
        imported++;
      }

      // Save only in browser storage.
      // No database or crawler modifications.

      saveDrafts(drafts);
      renderDrafts();

      input.value = "";

      feedback.textContent =
        `Imported ${imported} draft(s), ` +
        `skipped ${skipped} duplicate/invalid record(s). ` +
        `Nothing was added to the catalogue.`;

    } catch (error) {

      feedback.textContent =
        "Import failed: " + error.message;

    }
  }


  // IMPORT AND DOWNLOAD BUTTONS

  document.addEventListener("click", event => {

    if (event.target.closest("#rootsImportButton")) {
      importJSON();
    }

    const button = event.target.closest(
      "[data-export-draft]"
    );

    if (button) {

      const draft = loadDrafts().find(
        item =>
          String(item.id) ===
          button.dataset.exportDraft
      );

      if (!draft) return;

      const blob = new Blob(
        [JSON.stringify(draft, null, 2)],
        { type: "application/json" }
      );

      const temporaryURL =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = temporaryURL;

      link.download =
        "roots-community-draft.json";

      link.click();

      setTimeout(
        () => URL.revokeObjectURL(temporaryURL),
        1000
      );
    }
  });


  // KEEP CATEGORY FILTERING WORKING

  const previousRenderPage = renderPage;

  renderPage = () => {

    const route =
      location.hash.slice(1) || "home";

    const [page, query] = route.split("?");

    state.category =
      page === "explore"
        ? new URLSearchParams(query || "")
            .get("category") || ""
        : "";

    previousRenderPage();
  };


  // Refresh existing page with updated functionality.

  renderPage();

})();
</script>
